server:
  port: ${SERVER_PORT:8789}
  servlet:
    session:
      cookie:
        name: ONETERM_SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: oneterm-backend
  datasource:
    url: jdbc:sqlite:${ONETERM_DB_PATH:./data/oneterm.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

oneterm:
  mock: ${ONETERM_MOCK:false}
  secret-key: ${ONETERM_SECRET_KEY:dev-only-oneterm-aes256-secret-key-32b}
  admin:
    username: ${ONETERM_ADMIN_USERNAME:admin}
    password: ${ONETERM_ADMIN_PASSWORD:Admin@123456}
